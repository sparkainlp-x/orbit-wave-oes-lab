name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]" ruff
      - run: ruff check src tests
      - run: ruff check --select S src tests
      - run: python -m pytest -q
      - run: python -m pip wheel --no-deps --wheel-dir dist .

  official-oes:
    name: Official OES-Resilience v0.6.0 integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test,oes]"
      - run: python -m pytest -q
      - run: orbit-wave-oes demo --out-dir build/oes-demo --with-oes
      - name: Check evidence passport
        run: python -c "import json; p=json.load(open('build/oes-demo/evidence-passport/synthetic-orbit-wave-demo.normalized.json')); assert p['integrity']['bundle_consistent']; assert p['evidence_class']=='synthetic'"
